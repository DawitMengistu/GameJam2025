<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP font test (temporary)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Chakra+Petch:wght@600;700&family=DM+Serif+Display&family=Exo+2:wght@700;800&family=Fjalla+One&family=Graduate&family=IBM+Plex+Sans:wght@600;700&family=Instrument+Sans:wght@600;700&family=Inter:wght@700;800&family=Kanit:wght@600;700&family=Lexend:wght@600;700&family=Montserrat:wght@700;800&family=Oswald:wght@600;700&family=Outfit:wght@700;800&family=Oxanium:wght@700;800&family=Permanent+Marker&family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Poppins:wght@600;700;800&family=Rajdhani:wght@600;700&family=Righteous&family=Roboto+Condensed:wght@700;800&family=Rubik:wght@700;800&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&family=Teko:wght@600;700&family=Titan+One&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #6c9a4c;
            --ink: #3b3b3b;
            --muted: #6b7280;
            --page: #e8ece4;
            --surface: #fff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: linear-gradient(160deg, var(--page), #d4dccf);
            color: var(--ink);
            padding: 24px 16px 64px;
        }
        header {
            max-width: 920px;
            margin: 0 auto 28px;
        }
        header h1 {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }
        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .grid {
            max-width: 920px;
            margin: 0 auto;
            display: grid;
            gap: 12px;
        }
        .card {
            background: var(--surface);
            border: 1px solid rgba(59, 59, 59, 0.1);
            border-radius: 14px;
            padding: 18px 20px 16px;
            box-shadow: 0 8px 24px rgba(59, 59, 59, 0.08);
            cursor: pointer;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .card:hover {
            border-color: rgba(108, 154, 76, 0.55);
            box-shadow: 0 10px 28px rgba(108, 154, 76, 0.14);
        }
        .card.is-picked {
            border-color: var(--green);
            outline: 2px solid rgba(108, 154, 76, 0.35);
        }
        .sample {
            margin: 0;
            font-size: clamp(2.6rem, 7vw, 4rem);
            line-height: 1;
            letter-spacing: 0.04em;
            color: var(--green);
            user-select: none;
        }
        .meta {
            margin: 10px 0 0;
            font-size: 0.78rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .picked-bar {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            background: #1a1f27;
            color: #e8ece4;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            max-width: calc(100vw - 24px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .picked-bar:empty { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>Temporary ATP title font picker</h1>
        <p>Click a card to mark your favorite. Copy the font name when you decide — this page can be deleted afterward.</p>
    </header>
    <div class="grid" id="grid"></div>
    <div class="picked-bar" id="picked"></div>
    <script>
        const fonts = [
            { name: 'Poppins', stack: '"Poppins", sans-serif', weight: 700 },
            { name: 'Inter', stack: '"Inter", sans-serif', weight: 800 },
            { name: 'Montserrat', stack: '"Montserrat", sans-serif', weight: 800 },
            { name: 'Space Grotesk', stack: '"Space Grotesk", sans-serif', weight: 700 },
            { name: 'Outfit', stack: '"Outfit", sans-serif', weight: 800 },
            { name: 'Plus Jakarta Sans', stack: '"Plus Jakarta Sans", sans-serif', weight: 800 },
            { name: 'Instrument Sans', stack: '"Instrument Sans", sans-serif', weight: 700 },
            { name: 'Lexend', stack: '"Lexend", sans-serif', weight: 700 },
            { name: 'IBM Plex Sans', stack: '"IBM Plex Sans", sans-serif', weight: 700 },
            { name: 'Syne', stack: '"Syne", sans-serif', weight: 800 },
            { name: 'Unbounded', stack: '"Unbounded", sans-serif', weight: 700 },
            { name: 'Oswald', stack: '"Oswald", sans-serif', weight: 700 },
            { name: 'Bebas Neue', stack: '"Bebas Neue", sans-serif', weight: 400 },
            { name: 'Anton', stack: '"Anton", sans-serif', weight: 400 },
            { name: 'Fjalla One', stack: '"Fjalla One", sans-serif', weight: 400 },
            { name: 'Teko', stack: '"Teko", sans-serif', weight: 700 },
            { name: 'Rajdhani', stack: '"Rajdhani", sans-serif', weight: 700 },
            { name: 'Chakra Petch', stack: '"Chakra Petch", sans-serif', weight: 700 },
            { name: 'Oxanium', stack: '"Oxanium", sans-serif', weight: 800 },
            { name: 'Exo 2', stack: '"Exo 2", sans-serif', weight: 800 },
            { name: 'Kanit', stack: '"Kanit", sans-serif', weight: 700 },
            { name: 'Rubik', stack: '"Rubik", sans-serif', weight: 800 },
            { name: 'Roboto Condensed', stack: '"Roboto Condensed", sans-serif', weight: 800 },
            { name: 'Archivo Black', stack: '"Archivo Black", sans-serif', weight: 400 },
            { name: 'Black Ops One', stack: '"Black Ops One", system-ui', weight: 400 },
            { name: 'Bungee', stack: '"Bungee", system-ui', weight: 400 },
            { name: 'Righteous', stack: '"Righteous", system-ui', weight: 400 },
            { name: 'Titan One', stack: '"Titan One", system-ui', weight: 400 },
            { name: 'Graduate', stack: '"Graduate", serif', weight: 400 },
            { name: 'Playfair Display', stack: '"Playfair Display", serif', weight: 800 },
            { name: 'DM Serif Display', stack: '"DM Serif Display", serif', weight: 400 },
            { name: 'Permanent Marker', stack: '"Permanent Marker", cursive', weight: 400 },
        ];

        const grid = document.getElementById('grid');
        const picked = document.getElementById('picked');
        let current = null;

        fonts.forEach((f, i) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            card.innerHTML =
                '<p class="sample" style="font-family:' + f.stack + ';font-weight:' + f.weight + '">ATP</p>' +
                '<p class="meta"><span>' + (i + 1) + '. ' + f.name + '</span><span>weight ' + f.weight + '</span></p>';
            card.addEventListener('click', () => {
                grid.querySelectorAll('.card').forEach((c) => c.classList.remove('is-picked'));
                card.classList.add('is-picked');
                current = f.name;
                picked.textContent = 'Picked: ' + f.name + '  ·  tell Cursor this name when you decide';
            });
            grid.appendChild(card);
        });
    </script>
</body>
</html>
