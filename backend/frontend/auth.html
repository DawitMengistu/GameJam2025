<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP — Sign in</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('atp-theme');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <div class="auth-loading-page">
        <div class="auth-spinner" id="auth-spinner" aria-hidden="true"></div>
        <p class="session-loading-text poppins-regular m-0" id="auth-loading-label">Signing you in…</p>
        <p id="auth-status" class="poppins-regular auth-err" style="display:none"></p>
    </div>
    <script>
        (async () => {
            const status = document.getElementById('auth-status');
            const spinner = document.getElementById('auth-spinner');
            const label = document.getElementById('auth-loading-label');
            const params = new URLSearchParams(location.search);
            const token = params.get('token');

            function fail(msg) {
                spinner.style.display = 'none';
                if (label) label.style.display = 'none';
                status.style.display = 'block';
                status.textContent = msg;
            }

            if (!token) {
                fail('Missing sign-in link. Open the link from Telegram again.');
                return;
            }

            try {
                const res = await fetch('/api/auth/consume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ token }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    fail(data.error || 'Sign-in failed');
                    return;
                }
                location.replace('/');
            } catch {
                fail('Network error. Try the Telegram link again.');
            }
        })();
    </script>
</body>
</html>
